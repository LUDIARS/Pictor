# Hair services launch the native Pictor executable from the project main
# folder. Candidate IDs are printed in the HUD/log; the selection service keeps
# only the requested split tips independent.
services:
  - code: pc-<term-c01>-stage-still
    name: <term-c01> stage C production still
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-stage-demo/pictor_<term-c01>_demo.exe
    app_kind: native
    exec_args:
      - --stage
      - --stage-orbit-curve
      - ${ARS_ROOT}/Pictor/build/<term-c01>-stage-demo/ks-turn-reference.txt
      - --capture
      - ${ARS_ROOT}/Pictor/build/<term-c01>-stage-demo/stage-still.bmp
      - --capture-frame
      - '0'
      - --window-width
      - '800'
      - --window-height
      - '960'
      - --zoom
      - '1.05'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-stage-video
    name: <term-c01> stage C production frames
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-stage-demo/pictor_<term-c01>_demo.exe
    app_kind: native
    exec_args:
      - --stage
      - --stage-orbit-curve
      - ${ARS_ROOT}/Pictor/build/<term-c01>-stage-demo/ks-turn-reference.txt
      - --record-frames
      - ${ARS_ROOT}/Pictor/build/<term-c01>-stage-demo/stage-frames
      - --record-count
      - '432'
      - --record-fps
      - '24'
      - --window-width
      - '800'
      - --window-height
      - '960'
      - --zoom
      - '1.05'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-hair-video
    name: Pictor <term-c01> hair wind video frames
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-wind-sequence
      - --record-frames
      - ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/wind-fork-video-frames
      - --record-count
      - '300'
      - --record-fps
      - '30'
      - --pn-factor
      - '2'
      - --zoom
      - '0.9'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-hair
    name: Pictor <term-c01> live Fg hair formulas
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-wind-sequence
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-hair-capture
    name: Pictor <term-c01> Fg hair wind capture
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-freeze
      - --capture
      - ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/hair-still.bmp
      - --capture-frame
      - '4'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-hair-select
    name: Pictor <term-c01> selected independent hair tips
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-independent
      - '0,2,5'
      - --hair-wind-sequence
      - --pn-factor
      - '2'
      - --zoom
      - '0.9'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-demo
    name: Pictor <term-c01> polynomial raymarch
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-demo/pictor_<term-c01>_demo.exe
    app_kind: native
    exec_args: []
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-capture
    name: Pictor <term-c01> comparison capture
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-demo/pictor_<term-c01>_demo.exe
    app_kind: native
    exec_args:
      - --capture-set
      - ${ARS_ROOT}/Pictor/build/<term-c01>-demo/raymarch-results
      - --pn-report
      - ${ARS_ROOT}/Pictor/build/<term-c01>-demo/raymarch-results/refinement.jsonl
    autostart: false
    restart_policy: 'no'
    health:
      type: process
