# NOTE: the three pc-<term-c01>-hair-* services below are placeholders for the
# planned hair work (spec/tasks/20260908-polynomial-motion-hair.md). Neither
# the pictor_<term-c01>_hair_demo target nor the --hair-* options exist yet, so
# these entries cannot be launched until that target lands. The pc-<term-c01>-demo
# and pc-<term-c01>-capture services below are backed by this PR's build.
services:
  - code: pc-<term-c01>-hair-video
    name: Pictor <term-c01> hair wind video frames
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-wind-sequence
      - --record-frames
      - ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/wind-fork-video-frames
      - --record-count
      - '300'
      - --record-fps
      - '30'
      - --pn-factor
      - '2'
      - --zoom
      - '0.9'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-hair
    name: Pictor <term-c01> live Fg hair formulas
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-wind-sequence
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-hair-capture
    name: Pictor <term-c01> Fg hair wind capture
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/pictor_<term-c01>_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-freeze
      - --capture
      - ${ARS_ROOT}/Pictor/build/<term-c01>-hair-demo/hair-still.bmp
      - --capture-frame
      - '4'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-demo
    name: Pictor <term-c01> polynomial raymarch
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-demo/pictor_<term-c01>_demo.exe
    app_kind: native
    exec_args: []
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-<term-c01>-capture
    name: Pictor <term-c01> comparison capture
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/<term-c01>-demo/pictor_<term-c01>_demo.exe
    app_kind: native
    exec_args:
      - --capture-set
      - ${ARS_ROOT}/Pictor/build/<term-c01>-demo/raymarch-results
      - --pn-report
      - ${ARS_ROOT}/Pictor/build/<term-c01>-demo/raymarch-results/refinement.jsonl
    autostart: false
    restart_policy: 'no'
    health:
      type: process
