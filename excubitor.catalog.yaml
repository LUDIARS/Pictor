# Hair services launch the native Pictor executable from the project main
# folder. Candidate IDs are printed in the HUD/log; the selection service keeps
# only the requested split tips independent.
services:
  - code: pc-kuzuha-stage-still
    name: Kuzuha stage C production still
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-stage-demo/pictor_kuzuha_demo.exe
    app_kind: native
    exec_args:
      - --stage
      - --stage-orbit-curve
      - ${ARS_ROOT}/Pictor/build/kuzuha-stage-demo/ks-turn-reference.txt
      - --capture
      - ${ARS_ROOT}/Pictor/build/kuzuha-stage-demo/stage-still.bmp
      - --capture-frame
      - '0'
      - --window-width
      - '800'
      - --window-height
      - '960'
      - --zoom
      - '1.05'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-stage-video
    name: Kuzuha stage C production frames
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-stage-demo/pictor_kuzuha_demo.exe
    app_kind: native
    exec_args:
      - --stage
      - --stage-orbit-curve
      - ${ARS_ROOT}/Pictor/build/kuzuha-stage-demo/ks-turn-reference.txt
      - --record-frames
      - ${ARS_ROOT}/Pictor/build/kuzuha-stage-demo/stage-frames
      - --record-count
      - '432'
      - --record-fps
      - '24'
      - --window-width
      - '800'
      - --window-height
      - '960'
      - --zoom
      - '1.05'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-hair-video
    name: Pictor Kuzuha hair wind video frames
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-hair-demo/pictor_kuzuha_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-wind-sequence
      - --record-frames
      - ${ARS_ROOT}/Pictor/build/kuzuha-hair-demo/wind-fork-video-frames
      - --record-count
      - '300'
      - --record-fps
      - '30'
      - --pn-factor
      - '2'
      - --zoom
      - '0.9'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-hair
    name: Pictor Kuzuha live Fg hair formulas
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-hair-demo/pictor_kuzuha_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-wind-sequence
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-hair-capture
    name: Pictor Kuzuha Fg hair wind capture
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-hair-demo/pictor_kuzuha_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-freeze
      - --capture
      - ${ARS_ROOT}/Pictor/build/kuzuha-hair-demo/hair-still.bmp
      - --capture-frame
      - '4'
      - --pn-factor
      - '2'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-hair-select
    name: Pictor Kuzuha selected independent hair tips
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-hair-demo/pictor_kuzuha_hair_demo.exe
    app_kind: native
    exec_args:
      - --hair-warmup
      - '2'
      - --hair-independent
      - '0,2,5'
      - --hair-wind-sequence
      - --pn-factor
      - '2'
      - --zoom
      - '0.9'
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-demo
    name: Pictor Kuzuha polynomial raymarch
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-demo/pictor_kuzuha_demo.exe
    app_kind: native
    exec_args: []
    autostart: false
    restart_policy: 'no'
    health:
      type: process
  - code: pc-kuzuha-capture
    name: Pictor Kuzuha comparison capture
    project_code: Pc
    tier: local-app
    repo: LUDIARS/Pictor
    runtime: app
    cwd: ${ARS_ROOT}/Pictor
    exec: ${ARS_ROOT}/Pictor/build/kuzuha-demo/pictor_kuzuha_demo.exe
    app_kind: native
    exec_args:
      - --capture-set
      - ${ARS_ROOT}/Pictor/build/kuzuha-demo/raymarch-results
      - --pn-report
      - ${ARS_ROOT}/Pictor/build/kuzuha-demo/raymarch-results/refinement.jsonl
    autostart: false
    restart_policy: 'no'
    health:
      type: process
