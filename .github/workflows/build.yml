name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libvulkan-dev \
            libglfw3-dev \
            glslang-tools \
            spirv-tools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICTOR_BUILD_DEMO=OFF \
            -DPICTOR_BUILD_BENCHMARK=OFF

      - name: Build (pictor library)
        run: cmake --build build --target pictor --parallel
